<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - CTJobs</title>
    <link rel="stylesheet" href="../assets/css/normalize.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <div class="container" style="max-width: 500px; margin: 50px auto; padding: 20px;">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="regName">Họ tên</label>
                <input type="text" id="regName" class="form-control" required>
            </div>
            <div class="form-group password-group">
                <label for="regPassword">Mật khẩu</label>
                <div class="password-field">
                    <input type="password" id="regPassword" class="form-control" required>
                    <button type="button" class="toggle-password" aria-label="Hiện/ẩn mật khẩu">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group password-group">
                <label for="regConfirmPassword">Xác nhận mật khẩu</label>
                <div class="password-field">
                    <input type="password" id="regConfirmPassword" class="form-control" required>
                    <button type="button" class="toggle-password" aria-label="Hiện/ẩn mật khẩu">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Đăng ký</button>
        </form>
        <p class="mt-3">Đã có tài khoản? <a href="../index.html">Đăng nhập ngay</a></p>
    </div>

    <script src="../assets/js/modules/toast.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('regEmail').value;
            const name = document.getElementById('regName').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (password !== confirmPassword) {
                Toast.error('Mật khẩu xác nhận không khớp!');
                return;
            }
            
            // Lưu thông tin đăng ký (demo)
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userInfo', JSON.stringify({
                email: email,
                name: name
            }));
            
            Toast.success('Đăng ký thành công! Bạn sẽ được chuyển đến trang chủ.');
            setTimeout(() => {
                window.location.href = '../index.html';
            }, 2000);
        });
        
        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const passwordField = this.closest('.password-field').querySelector('input');
                const icon = this.querySelector('i');
                
                if (passwordField && icon) {
                    passwordField.type = passwordField.type === 'password' ? 'text' : 'password';
                    icon.classList.toggle('bi-eye');
                    icon.classList.toggle('bi-eye-slash');
                }
            });
        });
    </script>
</body>
</html>
