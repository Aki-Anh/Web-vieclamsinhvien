<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ - CTJobs</title>
    <link rel="stylesheet" href="../assets/css/normalize.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <div class="container" style="max-width: 800px; margin: 50px auto; padding: 20px;">
        <div class="d-flex align-items-center mb-4">
            <a href="../index.html" class="btn btn-link">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
            <h2 class="mb-0 ms-3">Hồ sơ cá nhân</h2>
        </div>
        
        <div id="profileContent">
            <!-- Nội dung hồ sơ sẽ được load bằng JavaScript -->
        </div>
    </div>

    <script>
        // Kiểm tra đăng nhập
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '../index.html';
        }

        // Hiển thị thông tin hồ sơ
        const userInfo = JSON.parse(localStorage.getItem('userInfo')) || {};
        document.getElementById('profileContent').innerHTML = `
            <div class="card">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <img src="https://placehold.co/100x100" alt="Avatar" class="rounded-circle mb-3" style="width: 100px; height: 100px;">
                        <h4>${userInfo.name || 'Người dùng'}</h4>
                        <p class="text-muted">${userInfo.email}</p>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Họ và tên:</label>
                            <input type="text" class="form-control" value="${userInfo.name || ''}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" class="form-control" value="${userInfo.email}" readonly>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="text" class="form-control" placeholder="Nhập số điện thoại">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Địa chỉ:</label>
                            <input type="text" class="form-control" placeholder="Nhập địa chỉ">
                        </div>
                    </div>
                    
                    <div class="text-center mt-4">
                        <button class="btn btn-primary">Cập nhật hồ sơ</button>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
